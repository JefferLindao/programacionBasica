<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>MOKEPON!</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <section id="seleccionar-mascota">
    <h1 class="titulo">Mokepon</h1>

    <h2 class="subtitulo">Elige tu mascota:</h2>

    <div id="contenedor-tarjetas" class="tarjetas">

    </div>

    <button id="boton-mascota">Seleccionar</button>
  </section>

  <section id="ver-mapa">
      <h1 class="titulo">Recorre el mapa con tu mokepon</h1>
      <canvas id="mapa"></canvas>
      <botton onmouseup="detenerMovimiento()" onmousedown="moverArriba()">Arriba</botton>
      <botton onmouseup="detenerMovimiento()" onmousedown="moverIzquierda()">Izquierda</botton>
      <botton onmouseup="detenerMovimiento()" onmousedown="moverAbajo()">Abajo</botton>
      <botton onmouseup="detenerMovimiento()" onmousedown="moverDerecha()">Derecha</botton>
  </section>

  <section id="seleccionar-ataque">
    <h1 class="titulo">Mokepon</h1>

    <h2 class="subtitulo">Elige tu ataque:</h2>

    <div id="contenedor-ataques" class="tarjeta-ataques">
    </div>

    <div id="mensajes">
      <p id="resultado">Mucha suertre</p>
      <section id="reiniciar">
        <button id="boton-reiniciar">Reiniciar</button>
      </section>
    </div>

    <div class="ataque">
      <div class="ataque-jugador">
        <p id="vidas-jugador">0</p>
        <p id="mascota-jugador"></p>
        <div id="ataque-del-jugador"></div>
      </div>
      <div class="ataque-enemigo">
        <p id="vidas-enemigo">0</p>
        <p id="mascota-enemigo"></p>
        <div id="ataque-del-enemigo"></div>
      </div>
    </div>
  </section>
  <script src="./js/mokepon.js"></script>
</body>

</html>
